<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كتالوج أعمال هاي روياليتي 2026</title>
<meta name="description" content="كتالوج أعمال هاي روياليتي للاستثمار العقاري 2026 — واجهات كرتن وول، زجاج سكوريت وأبواب استشعار، تشطيبات، مطابخ، دريسنج وأعمال خشبية.">
<meta name="theme-color" content="#111214">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  body{background:#0d0d0f;color:#fff}
  .bar{position:sticky;top:0;z-index:20;background:rgba(17,18,20,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line-dark)}
  .bar .wrap{max-width:1500px;display:flex;align-items:center;gap:14px;height:66px}
  .bar .brand img{height:36px}
  .bar-title{font-family:var(--head);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-title small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted-dark)}
  .bar-sp{flex:1}
  .count{font-family:var(--head);font-size:14px;color:var(--muted-dark);direction:ltr;min-width:64px;text-align:center}
  .count b{color:#fff}
  .tb{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:var(--radius);border:1px solid var(--line-dark);background:transparent;color:#fff;font-size:14px;font-weight:500;white-space:nowrap;transition:background .2s,border-color .2s}
  .tb:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.35)}
  .tb.primary{background:var(--brand);border-color:var(--brand)}
  .tb.primary:hover{background:var(--brand-deep)}
  .tb svg{width:17px;height:17px}
  .layout{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:150px 1fr;gap:28px;padding:28px var(--gutter) 60px}
  .thumbs{position:sticky;top:94px;height:calc(100vh - 120px);overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-inline-end:6px;scrollbar-width:thin;scrollbar-color:#333 transparent}
  .thumbs button{border:1px solid transparent;padding:0;background:#1a1a1d;border-radius:2px;position:relative;opacity:.55;transition:opacity .2s,border-color .2s;flex:none}
  .thumbs button:hover{opacity:.9}
  .thumbs button.on{opacity:1;border-color:var(--brand)}
  .thumbs img{width:100%;aspect-ratio:1600/1131;object-fit:cover}
  .thumbs span{position:absolute;bottom:4px;inset-inline-start:4px;font-size:11px;background:rgba(0,0,0,.7);padding:0 6px;border-radius:2px;direction:ltr;font-family:var(--head)}
  .pages{display:flex;flex-direction:column;gap:22px;align-items:center;min-width:0}
  .pg{width:100%;max-width:1200px;aspect-ratio:1600/1131;background:#1a1a1d;box-shadow:0 20px 50px -20px rgba(0,0,0,.8);position:relative}
  .pg img{width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .4s}
  .pg img.loaded{opacity:1}
  /* presentation mode */
  .present .layout{display:none}
  .stage{display:none;position:fixed;inset:66px 0 0;align-items:center;justify-content:center;padding:18px 76px;touch-action:pan-y}
  .present .stage{display:flex}
  .stage img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 20px 50px -20px rgba(0,0,0,.8)}
  .stage .icon-btn{position:absolute;top:50%;transform:translateY(-50%)}
  .s-prev{inset-inline-start:16px}.s-next{inset-inline-end:16px}
  @media (max-width:900px){
    .layout{grid-template-columns:1fr;padding:14px 10px 40px}
    .thumbs{display:none}
    .pages{gap:12px}
    .hide-m{display:none}
    .bar .wrap{gap:8px}
    .tb{padding:0 12px}
    .stage{padding:12px 8px 80px}
    .stage .icon-btn{top:auto;bottom:18px;transform:none}
  }
  @media (max-width:480px){.bar-title{display:none}.tb .lbl{display:none}.tb{width:42px;padding:0;justify-content:center}.tb.primary{width:auto;padding:0 12px}.tb.primary .lbl{display:inline}}
</style>
</head>
<body>
<div class="bar">
  <div class="wrap">
    <a class="brand" href="../index.html#catalog" aria-label="العودة للموقع"><img src="../assets/mark-light.png" alt="هاي روياليتي" width="675" height="629"></a>
    <div class="bar-title">كتالوج الأعمال 2026<small>هاي روياليتي للاستثمار العقاري</small></div>
    <div class="bar-sp"></div>
    <div class="count" id="count"><b>1</b> / 30</div>
    <button class="tb" id="modeBtn" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="13" rx="1"/><path d="M8 21h8"/></svg><span class="lbl">عرض تقديمي</span></button>
    <button class="tb hide-m" id="fsBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="lbl">ملء الشاشة</span></button>
    <a class="tb primary" href="High-Royalty-Catalog-2026.pdf" download><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14"/></svg><span class="lbl">تحميل PDF</span></a>
  </div>
</div>

<div class="layout">
  <nav class="thumbs" id="thumbs" aria-label="صفحات الكتالوج"></nav>
  <main class="pages" id="pages"></main>
</div>
<div class="stage" id="stage">
  <button class="icon-btn s-prev" id="sPrev" aria-label="الصفحة السابقة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m9 5 7 7-7 7"/></svg></button>
  <img id="sImg" alt="">
  <button class="icon-btn s-next" id="sNext" aria-label="الصفحة التالية"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m15 5-7 7 7 7"/></svg></button>
</div>

<script src="pages/pages.js"></script>
<script>
(function () {
  var P = window.HR_PAGES || [], N = P.length, cur = 0;
  var pagesEl = document.getElementById('pages'), thumbsEl = document.getElementById('thumbs'), countEl = document.getElementById('count');
  var sImg = document.getElementById('sImg');
  function setCount(i) {
    cur = i; countEl.innerHTML = '<b>' + (i + 1) + '</b> / ' + N;
    var t = thumbsEl.children;
    for (var k = 0; k < t.length; k++) t[k].classList.toggle('on', k === i);
    if (t[i] && document.activeElement !== t[i]) {
      var tb = thumbsEl.getBoundingClientRect(), r = t[i].getBoundingClientRect();
      if (r.top < tb.top || r.bottom > tb.bottom) thumbsEl.scrollTop += r.top - tb.top - 40;
    }
  }
  var lazy = 'IntersectionObserver' in window ? new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) { var im = e.target; im.src = im.dataset.src; lazy.unobserve(im); } });
  }, { rootMargin: '800px 0px' }) : null;
  P.forEach(function (f, i) {
    var d = document.createElement('div'); d.className = 'pg'; d.id = 'p' + (i + 1);
    var im = document.createElement('img'); im.alt = 'صفحة ' + (i + 1) + ' من الكتالوج'; im.decoding = 'async';
    im.onload = function () { im.classList.add('loaded'); };
    im.dataset.src = 'pages/' + f;
    if (lazy && i > 1) lazy.observe(im); else im.src = im.dataset.src;
    d.appendChild(im); pagesEl.appendChild(d);
    var b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', 'الانتقال إلى صفحة ' + (i + 1));
    b.innerHTML = '<img src="pages/' + f + '" alt="" loading="lazy"><span>' + (i + 1) + '</span>';
    b.addEventListener('click', function () { d.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    thumbsEl.appendChild(b);
  });
  if ('IntersectionObserver' in window) {
    var vis = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) setCount(+e.target.id.slice(1) - 1); });
    }, { rootMargin: '-45% 0px -45% 0px' });
    pagesEl.querySelectorAll('.pg').forEach(function (p) { vis.observe(p); });
  }
  document.documentElement.style.scrollPaddingTop = '86px';
  setCount(0);

  /* presentation mode */
  var body = document.body, modeBtn = document.getElementById('modeBtn');
  function go(i) { i = Math.max(0, Math.min(N - 1, i)); sImg.src = 'pages/' + P[i]; sImg.alt = 'صفحة ' + (i + 1); setCount(i); if (P[i + 1]) (new Image()).src = 'pages/' + P[i + 1]; }
  function setMode(on) {
    var at = cur;
    body.classList.toggle('present', on); modeBtn.setAttribute('aria-pressed', on);
    modeBtn.querySelector('.lbl').textContent = on ? 'عرض متصل' : 'عرض تقديمي';
    if (on) go(at); else { var el = document.getElementById('p' + (at + 1)); if (el) el.scrollIntoView({ block: 'start' }); }
  }
  modeBtn.addEventListener('click', function () { setMode(!body.classList.contains('present')); });
  document.getElementById('sNext').addEventListener('click', function () { go(cur + 1); });
  document.getElementById('sPrev').addEventListener('click', function () { go(cur - 1); });
  document.addEventListener('keydown', function (e) {
    if (!body.classList.contains('present')) return;
    if (e.key === 'ArrowLeft' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(cur + 1); }
    else if (e.key === 'ArrowRight' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
    else if (e.key === 'Home') go(0); else if (e.key === 'End') go(N - 1);
    else if (e.key === 'Escape') setMode(false);
  });
  var st = document.getElementById('stage'), x0 = null;
  st.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  st.addEventListener('touchend', function (e) { if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 45) go(cur + (dx > 0 ? 1 : -1)); x0 = null; });

  var fsBtn = document.getElementById('fsBtn');
  if (!document.documentElement.requestFullscreen) fsBtn.style.display = 'none';
  fsBtn.addEventListener('click', function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().then(function () { if (!body.classList.contains('present')) setMode(true); }).catch(function () {});
  });
})();
</script>
</body>
</html>
